<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centrorochas – Faça parte do ecossistema</title>
  <link rel="icon" type="image/png" href="https://cdn.prod.website-files.com/64ee410e3b1bad3b81f3a7bc/67b39ab38bb32132b219b2b6_webclip.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #111b21;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* ===== CONTAINER ===== */
    .wa-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0b141a;
      position: relative;
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    .wa-header {
      background: #1b5e38;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      border-bottom: 1px solid #145030;
    }
    .wa-avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; overflow: hidden;
    }
    .wa-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .wa-contact { flex: 1; }
    .wa-name   { color: #e9edef; font-size: 16px; font-weight: 600; }
    .wa-status { color: rgba(255,255,255,0.75); font-size: 12px; }

    /* ===== CHAT AREA ===== */
    .wa-chat {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 80px;
      background-color: #efeae2;
      background-image: url("https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png");
      background-repeat: repeat;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .wa-chat::-webkit-scrollbar { width: 6px; }
    .wa-chat::-webkit-scrollbar-track { background: transparent; }
    .wa-chat::-webkit-scrollbar-thumb { background: #b2b2b2; border-radius: 3px; }

    /* ===== MESSAGES ===== */
    .msg {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.45;
      position: relative;
      animation: fadeIn 0.3s ease;
      word-wrap: break-word;
    }
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(6px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .msg.bot  { background:#fff; color:#3b4a54; align-self:flex-start; border-top-left-radius:0; }
    .msg.user { background:#1b5e38; color:#e9edef; align-self:flex-end; border-top-right-radius:0; }
    .msg .time { font-size:11px; text-align:right; margin-top:4px; color:#8696a0; }
    .msg.user .time { color:rgba(255,255,255,0.55); }

    /* ===== TYPING ===== */
    .typing {
      display:flex; gap:4px; padding:12px 14px;
      align-self:flex-start; background:#fff;
      border-radius:8px; border-top-left-radius:0;
      animation: fadeIn 0.2s ease;
    }
    .typing span {
      width:8px; height:8px; background:#8696a0;
      border-radius:50%; animation: bounce 1.4s infinite;
    }
    .typing span:nth-child(2){ animation-delay:.2s; }
    .typing span:nth-child(3){ animation-delay:.4s; }
    @keyframes bounce {
      0%,60%,100%{ transform:translateY(0); }
      30%{ transform:translateY(-6px); }
    }

    /* ===== OPTIONS ===== */
    .options {
      display:flex; flex-direction:column; gap:6px;
      margin-top:6px; align-self:flex-start;
      width: min(85%, 340px);
      animation: fadeIn .3s ease;
    }
    .opt-btn {
      background:#fff; border:1.5px solid #1b5e38; color:#1b5e38;
      padding:9px 16px; border-radius:20px; font-size:13.5px;
      cursor:pointer; text-align:left;
      transition:background .18s, color .18s; font-family:inherit;
    }
    .opt-btn:hover { background:#1b5e38; color:#fff; }

    /* ===== DATE SEPARATOR ===== */
    .date-sep { text-align:center; margin:8px 0; align-self:center; }
    .date-sep span {
      background:rgba(255,255,255,0.9); color:#555;
      font-size:12px; padding:4px 12px; border-radius:6px;
    }

    /* ===== INPUT AREA ===== */
    .input-area {
      display:flex; gap:8px; padding:8px 12px;
      background:#f0f2f5; border-top:1px solid #e0e0e0;
      position:fixed; bottom:0; left:0; right:0;
      z-index:999;
      animation: fadeIn .3s ease;
    }
    .input-area input {
      flex:1; background:#fff; border:1px solid #ddd;
      border-radius:22px; padding:10px 16px; color:#3b4a54;
      font-size:14px; font-family:inherit; outline:none;
      transition:border-color .18s;
    }
    .input-area input:focus { border-color:#1b5e38; }
    .input-area input::placeholder { color:#aaa; }
    .send-btn {
      background:#1b5e38; border:none; border-radius:50%;
      width:42px; height:42px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:background .18s;
    }
    .send-btn:hover { background:#145030; }
    .send-btn svg { width:20px; height:20px; }

    /* ===== LOADING OVERLAY ===== */
    .loading-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.45);
      display:flex; align-items:center; justify-content:center; z-index:9999;
    }
    .spinner {
      width:42px; height:42px; border:3px solid rgba(255,255,255,0.3);
      border-top-color:#fff; border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin { to{ transform:rotate(360deg); } }
    .hidden { display:none !important; }

    @media(max-width:480px){
      .wa-container { max-height:none; height:100dvh; }
      .msg { max-width:88%; }
    }
  </style>
</head>
<body>

<div class="wa-container">
  <!-- Header -->
  <div class="wa-header">
    <div class="wa-avatar">
      <img src="https://cdn.prod.website-files.com/64ee410e3b1bad3b81f3a7bc/67b39ab38bb32132b219b2b6_webclip.png" alt="Centrorochas">
    </div>
    <div class="wa-contact">
      <div class="wa-name">Centrorochas</div>
      <div class="wa-status" id="statusEl">online</div>
    </div>
  </div>

  <!-- Chat -->
  <div class="wa-chat" id="chat"></div>
</div>

<!-- Loading -->
<div class="loading-overlay hidden" id="loadingOverlay">
  <div class="spinner"></div>
</div>

<script>
(function(){
  // ========== CONFIG ==========
  const PORTAL_ID = "47817260";
  const FORM_ID   = "1fc9cc84-8738-4af6-b0a6-8a808765d873";

  const chat      = document.getElementById("chat");
  const statusEl  = document.getElementById("statusEl");
  const loading   = document.getElementById("loadingOverlay");
  const collected = {};

  // ========== UTILS ==========
  const getTime = () => {
    const n = new Date();
    return String(n.getHours()).padStart(2,"0") + ":" + String(n.getMinutes()).padStart(2,"0");
  };
  const scrollBot = () => requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
  const delay     = ms => new Promise(r => setTimeout(r, ms));

  // ========== GREETING VALIDATOR ==========
  const CUMPRIMENTOS = [
    "olá","ola","oi","oii","hi","hello","hey","e aí","eai","bom dia","boa tarde",
    "boa noite","tudo bem","tudo bom","tudo","boa","alô","alo","salve","opa","yo"
  ];
  function pareceNome(txt) {
    const n = txt.trim().toLowerCase().replace(/[!?.]/g,"");
    if (CUMPRIMENTOS.includes(n)) return false;
    if (n.replace(/\s/g,"").length < 2) return false;
    if (!/[a-záéíóúâêîôûãõàèìòùäëïöüç]/i.test(n)) return false;
    if (/^\d+$/.test(n)) return false;
    return true;
  }

  // ========== RENDERING ==========
  function addDateSep() {
    const div = document.createElement("div");
    div.className = "date-sep";
    const f = new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});
    div.innerHTML = `<span>HOJE, ${f}</span>`;
    chat.appendChild(div); scrollBot();
  }

  function addBot(html) {
    return new Promise(async res => {
      const t = document.createElement("div");
      t.className = "typing";
      t.innerHTML = "<span></span><span></span><span></span>";
      chat.appendChild(t); scrollBot();
      await delay(800 + Math.random()*600);
      t.remove();
      const m = document.createElement("div");
      m.className = "msg bot";
      m.innerHTML = `${html}<div class="time">${getTime()}</div>`;
      chat.appendChild(m); scrollBot(); res();
    });
  }

  function addUser(txt) {
    const m = document.createElement("div");
    m.className = "msg user";
    m.innerHTML = `${txt}<div class="time">${getTime()}</div>`;
    chat.appendChild(m); scrollBot();
  }

  // ===== SINGLE SELECT =====
  function showOptions(opts, cb) {
    const wrap = document.createElement("div");
    wrap.className = "options";
    opts.forEach(o => {
      const btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.textContent = o.label;
      btn.addEventListener("click", () => { wrap.remove(); addUser(o.label); cb(o.value); });
      wrap.appendChild(btn);
    });
    chat.appendChild(wrap); scrollBot();
  }

  // ========== INPUT BUILDERS ==========
  function buildInput(type, placeholder, submitFn) {
    const area = document.createElement("div");
    area.className = "input-area";
    const inp = document.createElement("input");
    inp.type = type; inp.placeholder = placeholder;
    const btn = document.createElement("button");
    btn.className = "send-btn";
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>`;
    btn.addEventListener("click", submitFn);
    inp.addEventListener("keydown", e => { if(e.key==="Enter") submitFn(); });
    area.appendChild(inp); area.appendChild(btn);
    return { area, inp };
  }

  function showInput(area) {
    document.body.appendChild(area);
    chat.style.paddingBottom = "80px";
    scrollBot();
  }
  function removeInput(area) {
    area.remove();
    chat.style.paddingBottom = "80px";
  }

  // Nome com validação de cumprimentos
  function askNome(isFirst, cb) {
    const { area, inp } = buildInput("text", "Digite aqui...", submit);
    function submit() {
      const v = inp.value.trim(); if (!v) return;
      removeInput(area); addUser(v);
      if (isFirst && !pareceNome(v)) {
        (async()=>{
          await addBot("Parece que você digitou um cumprimento 😅 Por favor, me diga seu <b>nome</b>.");
          askNome(true, cb);
        })(); return;
      }
      cb(v);
    }
    showInput(area); inp.focus();
  }

  // E-mail
  function askEmail(cb) {
    const { area, inp } = buildInput("email", "seu@email.com", submit);
    function submit() {
      const v = inp.value.trim(); if (!v) return;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
        inp.style.borderColor="#e74c3c"; inp.placeholder="E-mail inválido, tente novamente"; inp.value=""; return;
      }
      removeInput(area); addUser(v); cb(v);
    }
    showInput(area); inp.focus();
  }

  // Telefone com máscara BR
  function askPhone(cb) {
    const { area, inp } = buildInput("tel", "(00) 00000-0000", submit);
    inp.addEventListener("input", () => {
      let v = inp.value.replace(/\D/g,"");
      if (v.length > 11) v = v.slice(0,11);
      if (v.length > 6)      inp.value = `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
      else if (v.length > 2) inp.value = `(${v.slice(0,2)}) ${v.slice(2)}`;
      else if (v.length > 0) inp.value = `(${v}`;
    });
    function submit() {
      const raw = inp.value.replace(/\D/g,"");
      if (raw.length < 10) { inp.style.borderColor="#e74c3c"; inp.placeholder="Número inválido"; inp.value=""; return; }
      removeInput(area); addUser(inp.value.trim()); cb("+55"+raw);
    }
    showInput(area); inp.focus();
  }

  // Texto genérico
  function askText(placeholder, cb) {
    const { area, inp } = buildInput("text", placeholder, submit);
    function submit() {
      const v = inp.value.trim(); if (!v) return;
      removeInput(area); addUser(v); cb(v);
    }
    showInput(area); inp.focus();
  }

  // CNPJ com máscara
  function askCnpj(cb) {
    const { area, inp } = buildInput("text", "00.000.000/0000-00", submit);
    inp.maxLength = 18;
    inp.addEventListener("input", () => {
      let v = inp.value.replace(/\D/g,"");
      if (v.length > 14) v = v.slice(0,14);
      if (v.length > 12)      inp.value = `${v.slice(0,2)}.${v.slice(2,5)}.${v.slice(5,8)}/${v.slice(8,12)}-${v.slice(12)}`;
      else if (v.length > 8)  inp.value = `${v.slice(0,2)}.${v.slice(2,5)}.${v.slice(5,8)}/${v.slice(8)}`;
      else if (v.length > 5)  inp.value = `${v.slice(0,2)}.${v.slice(2,5)}.${v.slice(5)}`;
      else if (v.length > 2)  inp.value = `${v.slice(0,2)}.${v.slice(2)}`;
      else                    inp.value = v;
    });
    function submit() {
      const raw = inp.value.replace(/\D/g,"");
      if (raw.length < 14) { inp.style.borderColor="#e74c3c"; inp.placeholder="CNPJ inválido (14 dígitos)"; inp.value=""; return; }
      removeInput(area); addUser(inp.value.trim()); cb(inp.value.trim());
    }
    showInput(area); inp.focus();
  }

  // ========== HUBSPOT ==========
  function getCookie(name) {
    const m = document.cookie.split("; ").find(r=>r.startsWith(name+"="));
    return m ? m.split("=")[1] : null;
  }

  async function submitHubSpot(fields) {
    const ctx = { pageUri: window.location.href, pageName: document.title };
    const hutk = getCookie("hubspotutk");
    if (hutk) ctx.hutk = hutk;
    const res = await fetch(
      `https://api.hsforms.com/submissions/v3/integration/submit/${PORTAL_ID}/${FORM_ID}`,
      { method:"POST", headers:{"Accept":"application/json","Content-Type":"application/json"},
        body: JSON.stringify({ fields: fields.filter(f=>f.value!==""), skipValidation:true, context:ctx }) }
    );
    const txt = await res.text();
    if (!res.ok) { let e; try{ e=JSON.parse(txt); }catch(_){ e={message:txt}; } throw new Error(e.message||`Erro ${res.status}`); }
    return JSON.parse(txt);
  }

  function setLoading(on) {
    loading.classList.toggle("hidden", !on);
    statusEl.textContent = on ? "enviando..." : "online";
  }

  // ========== FLOW ==========
  async function start() {
    addDateSep();
    await addBot("Olá! Seja bem-vindo(a) à <b>Centrorochas</b> 🪨");
    await delay(300);
    await addBot("Somos o ecossistema que <b>move o setor de rochas naturais no Brasil</b>. Preencha os dados abaixo para darmos início ao seu processo de associação e ter acesso a <b>benefícios exclusivos</b>!");
    await delay(300);
    await addBot("<b>1.</b> Qual é o seu <b>nome</b>?");
    askNome(true, async nome => {
      collected.firstname = nome;
      await addBot("<b>2.</b> E o seu <b>sobrenome</b>?");
      askNome(false, async sobrenome => {
        collected.lastname = sobrenome;
        await addBot("<b>3.</b> Qual é o seu <b>e-mail corporativo</b>?");
        askEmail(async email => {
          collected.email = email;
          await addBot("<b>4.</b> Qual é o seu <b>telefone</b> para contato? (com DDD)");
          askPhone(async phone => {
            collected.phone = phone;
            await askEmpresa();
          });
        });
      });
    });
  }

  async function askEmpresa() {
    await addBot("Ótimo! Agora me conte um pouco sobre a sua empresa 🏢");
    await delay(300);
    await addBot("<b>5.</b> Qual é o <b>nome da sua empresa</b>?");
    askText("Nome da empresa...", async empresa => {
      collected.company = empresa;
      await addBot("<b>6.</b> Qual é o <b>CNPJ</b> da sua empresa?");
      askCnpj(async cnpj => {
        collected.cnpj = cnpj;
        await askSegmento();
      });
    });
  }

  async function askSegmento() {
    await addBot("<b>7.</b> Qual é o <b>segmento</b> da sua empresa?");
    showOptions([
      { label: "⛏️ Extração",                                    value: "Extração" },
      { label: "🏭 Beneficiamento",                              value: "Beneficiamento" },
      { label: "📦 Comercialização",                             value: "Comercialização" },
      { label: "⛏️🏭 Extração e Beneficiamento",                 value: "Extração e Beneficiamento" },
      { label: "🏭📦 Beneficiamento e Comercial",                value: "Beneficiamento e Comercial" },
      { label: "🏭📦⛏️ Beneficiamento, Comercial e Extração",    value: "Beneficiamento, Comercial e Extração" },
      { label: "🔧 Outros",                                      value: "Outros" }
    ], async seg => {
      collected.segmento = seg;
      await askDecisao();
    });
  }

  async function askDecisao() {
    await addBot("<b>8.</b> O que faria sua empresa <b>decidir se associar hoje</b>?");
    showOptions([
      { label: "🎓 Capacitação",       value: "Capacitação" },
      { label: "🤝 Networking",        value: "Networking" },
      { label: "💰 Redução de Custos", value: "Redução de Custos" },
      { label: "🌎 Exportação",        value: "Exportação" }
    ], async decisao => {
      collected.decisao = decisao;
      await submitForm();
    });
  }

  async function submitForm() {
    setLoading(true);
    const fields = [
      { name: "firstname",                                           value: collected.firstname || "" },
      { name: "lastname",                                            value: collected.lastname  || "" },
      { name: "email",                                               value: collected.email     || "" },
      { name: "phone",                                               value: collected.phone     || "" },
      { name: "name",                                                value: collected.company   || "" },
      { name: "cnpj",                                                value: collected.cnpj      || "" },
      { name: "tg_segmento_da_sua_empresa",                          value: collected.segmento  || "" },
      { name: "tg_o_que_faria_sua_empresa_decidir_se_associar_hoje", value: collected.decisao   || "" }
    ];
    try {
      await submitHubSpot(fields);
      setLoading(false);
      await addBot(`Solicitação recebida com sucesso, <b>${collected.firstname}</b>! ✅`);
      await delay(400);
      await addBot("Obrigado pelo seu interesse em <b>fazer parte da Centrorochas</b>. Um de nossos consultores entrará em contato nas próximas horas através do <b>e-mail corporativo ou telefone</b> informado para apresentar a proposta ideal de enquadramento para o seu negócio. 🪨");
    } catch(e) {
      setLoading(false);
      console.error("Erro HubSpot:", e);
      await addBot("Desculpe, ocorreu um erro ao enviar suas informações. Por favor, tente novamente em instantes.");
    }
  }

  // ========== MOBILE KEYBOARD ==========
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", () => {
      const ia = document.querySelector(".input-area");
      if (ia) ia.style.bottom = (window.innerHeight - window.visualViewport.height) + "px";
      scrollBot();
    });
  }

  // ========== INIT ==========
  start();
})();
</script>

</body>
</html>
